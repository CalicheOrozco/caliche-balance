<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f0d" />
    <script>
      // Applies the theme before the first paint so there is no flash. src/theme.ts owns
      // later changes and uses the same storage key.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0b0f0d" : "#f6f8f7";
        // The accent unlocked by streaks (src/accent.ts).
        try { var accent = localStorage.getItem("accent"); if (accent) document.documentElement.dataset.accent = accent; } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Balance" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Caliche Balance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
